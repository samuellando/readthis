name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: samuellando/actions/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/samuellando/readthis

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: samuellando/actions/.github/workflows/update-infra.yml@main
    with:
      image: ghcr.io/samuellando/readthis
      tag: ${{ needs.build.outputs.image_tag }}
      infra_file: apps/readthis/kube_config.yml
    secrets:
      INFRA_PAT: ${{ secrets.INFRA_PAT }}
